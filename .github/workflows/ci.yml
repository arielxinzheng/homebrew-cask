name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cask:
    name: Cask lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check cask syntax
        run: |
          set -euo pipefail
          for f in Casks/*.rb; do
            echo "== $f"
            ruby -c "$f"
          done
